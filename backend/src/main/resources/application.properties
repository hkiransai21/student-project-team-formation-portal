server.port=8080
# Default = in-memory H2 (no setup). For MySQL set DB_URL, DB_USER, DB_PASSWORD (see README).
spring.datasource.url=${DB_URL:jdbc:h2:mem:portal;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=${SEED_MODE:embedded}
matching.url=${MATCHING_URL:http://localhost:8081}
cors.origins=${CORS_ORIGINS:http://localhost:5173}
