# Optional: MySQL for local development.  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in your shell or .env}
      MYSQL_DATABASE: portal
    ports: ["3306:3306"]
    volumes: ["./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql", "./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql"]
